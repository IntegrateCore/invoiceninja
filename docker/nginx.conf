# Debian's FastCGI defaults normalize HTTP_HOST with $host, which drops an
# external mapped port. Retain only a numeric port from the raw Host header.
map $http_host $invoiceninja_host_port {
    default "";
    "~^(?:[A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\]):(?<invoiceninja_request_port>[0-9]{1,5})$" ":$invoiceninja_request_port";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $host$invoiceninja_host_port;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
