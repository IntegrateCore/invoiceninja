name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP for portal dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, imagick, intl, mbstring, pdo_mysql, soap, zip
          tools: composer:v2
          coverage: none

      - name: Install portal PHP dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Build client portal assets
        run: |
          CYPRESS_INSTALL_BINARY=0 npm ci
          npm run build

      - name: Prepare React FrontEnd
        run: |
          git clone https://github.com/IntegrateCore/invoiceninja-ui.git
          cd invoiceninja-ui
          # Keep the dev backend and its client-library UI on matching branches.
          git checkout integratecore-client-files
          sed -i 's/VITE_IS_TEST=true/VITE_IS_TEST=false/' .env.example
          echo VITE_PUSHER_APP_KEY=f0111a02782708da651f >> .env.example

          cp .env.example .env
          cp ../vite.config.ts.react ./vite.config.js
          npm ci
          npm run build
          cp -r dist/* ../public/
          # Keep the built public index for the shared React Blade shell.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/integratecore/invoiceninja:dev
