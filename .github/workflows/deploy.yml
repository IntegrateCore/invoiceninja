name: Deploy

on:
  push:
    branches:
      - main
      - v5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare React FrontEnd
        run: |
          git clone https://${{secrets.commit_secret}}@github.com/bradleyseanf/ui.git
          cd ui
          git checkout main
          sed -i 's/VITE_IS_TEST=true/VITE_IS_TEST=false/' .env.example
          echo VITE_PUSHER_APP_KEY=f0111a02782708da651f >> .env.example

          cp .env.example .env
          cp ../vite.config.ts.react ./vite.config.js
          npm i
          npm run build
          cp -r dist/* ../public/
          mv ../public/index.html ../resources/views/react/index.blade.php

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/integratecore/invoiceninja:latest

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add Hetzner host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" bash -se <<'EOF'
            set -e

            pre_prune_docker() {
              docker compose down --remove-orphans || true
              docker system prune -af --volumes || true
              docker builder prune -af || true
              docker image prune -af || true
              docker volume prune -f || true
            }

            post_prune_docker() {
              docker system prune -af --volumes || true
              docker builder prune -af || true
              docker image prune -af || true
              docker volume prune -f || true
            }

            cd /srv/invoiceninja

            pre_prune_docker

            GHCR_TOKEN='${{ secrets.commit_secret }}'
            if [ -n "$GHCR_TOKEN" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u bradleyseanf --password-stdin
            else
              echo 'Skipping GHCR login because commit_secret is empty.'
            fi

            docker pull ghcr.io/integratecore/invoiceninja:latest
            docker compose up -d

            post_prune_docker

            df -h /
          EOF
