name: Deploy

on:
  push:
    branches:
      - main
      - v5-stable

concurrency:
  group: invoiceninja-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build client portal assets
        run: |
          CYPRESS_INSTALL_BINARY=0 npm ci
          npm run build

      - name: Prepare React FrontEnd
        run: |
          git clone https://github.com/IntegrateCore/invoiceninja-ui.git
          cd invoiceninja-ui
          git checkout main
          sed -i 's/VITE_IS_TEST=true/VITE_IS_TEST=false/' .env.example
          echo VITE_PUSHER_APP_KEY=f0111a02782708da651f >> .env.example

          cp .env.example .env
          cp ../vite.config.ts.react ./vite.config.js
          npm ci
          npm run build
          cp -r dist/* ../public/
          # The React Blade shell reads the built public index head at runtime.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/integratecore/invoiceninja:latest
            ghcr.io/integratecore/invoiceninja:${{ github.sha }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add Hetzner host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" bash -se <<'EOF'
            set -e

            cd /srv/invoiceninja
            umask 077
            release_id='${{ github.sha }}'
            backup_directory="/srv/invoiceninja/releases/$release_id"
            mkdir -p "$backup_directory"
            chmod 700 "$backup_directory"
            cp docker-compose.yml "$backup_directory/docker-compose.before.yml"
            cp .env "$backup_directory/env.before"
            docker exec invoiceninja-mysql-1 sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqldump -uroot --single-transaction "$MYSQL_DATABASE"' > "$backup_directory/database-before.sql"
            previous_image=$(docker inspect --format='{{.Image}}' invoiceninja-invoiceninja-1)
            docker tag "$previous_image" "integratecore/invoiceninja:rollback-$release_id"

            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull "ghcr.io/integratecore/invoiceninja:$release_id"
            docker tag "ghcr.io/integratecore/invoiceninja:$release_id" ghcr.io/integratecore/invoiceninja:latest
            docker compose up -d --no-deps invoiceninja
            healthy=false
            for attempt in $(seq 1 60); do
              if docker exec invoiceninja-invoiceninja-1 curl -fsS http://127.0.0.1/health > /dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 3
            done
            if [ "$healthy" != true ]; then
              echo 'Invoice Ninja did not become healthy; rollback image and database backup retained.' >&2
              exit 1
            fi

            df -h /
          EOF
